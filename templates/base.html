<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Assist{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body { background: #f4f6f9; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }

    /* tag inputs */
    .tag-input-wrap {
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
      border: 1px solid #ced4da; border-radius: .375rem;
      padding: 4px 8px; background: #fff; cursor: text; min-height: 38px;
    }
    .tag-input-wrap:focus-within { border-color: #86b7fe; box-shadow: 0 0 0 .25rem rgba(13,110,253,.25); }
    .tag-input-wrap input { border: none; outline: none; flex: 1; min-width: 80px; padding: 0; font-size:.875rem; }
    .tag { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px;
           border-radius: 12px; font-size: .78rem; font-weight: 500; }
    .tag-and { background: #cfe2ff; color: #084298; }
    .tag-or  { background: #d1e7dd; color: #0a3622; }
    .tag-not { background: #f8d7da; color: #58151c; }
    .tag-rm  { cursor: pointer; opacity: .55; font-size: .9em; line-height: 1; }
    .tag-rm:hover { opacity: 1; }

    /* job list */
    .job-row td { vertical-align: middle; }
    .job-row:hover { background: #eef2ff; }
    .star-btn { border: none; background: none; font-size: 1.15rem; cursor: pointer; padding: 0; }
    .star-btn.starred { color: #ffc107; }
    .score-pill {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: .75rem; font-weight: 600;
    }
    .score-hi  { background: #d1e7dd; color: #0a3622; }
    .score-mid { background: #fff3cd; color: #664d03; }
    .score-lo  { background: #f8d7da; color: #58151c; }
    .score-none { background: #e9ecef; color: #6c757d; }

    /* sidebar filters */
    .filter-sidebar { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; }
    .filter-section { border-bottom: 1px solid #dee2e6; padding-bottom: .75rem; margin-bottom: .75rem; }
    .filter-section:last-child { border-bottom: none; }

    pre.description { white-space: pre-wrap; font-family: inherit; font-size: .9rem; }
    .copy-btn { cursor: pointer; }

    /* eu region badge — Bootstrap has no purple text-bg-* utility */
    .text-bg-purple { background-color: #6f42c1 !important; color: #fff !important; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="/"><i class="bi bi-briefcase-fill me-1"></i>Job Assist</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='index' %}active{% endif %}" href="/">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='jobs' %}active{% endif %}" href="/jobs">
            <i class="bi bi-list-ul"></i> Jobs
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='bullet_editor' %}active{% endif %}" href="/bullet_editor">
            <i class="bi bi-list-check"></i> Bullet Bank
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='settings' %}active{% endif %}" href="/settings">
            <i class="bi bi-gear"></i> Settings
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='prompts' %}active{% endif %}" href="/prompts">
            <i class="bi bi-chat-quote"></i> Meta Prompts
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='system_prompts' %}active{% endif %}" href="/system_prompts">
            <i class="bi bi-robot"></i> System Prompts
          </a>
        </li>
      </ul>
      <span class="navbar-text text-muted small">localhost</span>
    </div>
  </div>
</nav>

<div class="container-fluid px-3">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/**
 * Tag input widget — no innerHTML; all DOM construction uses textContent.
 * tagClass: 'tag-and' | 'tag-or' | 'tag-not'
 */
function initTagInput(wrapperId, hiddenId, tagClass) {
  const wrap   = document.getElementById(wrapperId);
  const hidden = document.getElementById(hiddenId);
  const input  = wrap.querySelector('input');

  function getTags() {
    return hidden.value ? hidden.value.split(',').filter(Boolean) : [];
  }
  function setTags(arr) {
    hidden.value = arr.join(',');
  }

  function makeTagEl(kw) {
    const span = document.createElement('span');
    span.className = 'tag ' + tagClass;

    const text = document.createElement('span');
    text.textContent = kw;

    const rm = document.createElement('span');
    rm.className = 'tag-rm';
    rm.textContent = '✕';
    rm.dataset.kw = kw;

    span.appendChild(text);
    span.appendChild(rm);
    return span;
  }

  function render() {
    wrap.querySelectorAll('.tag').forEach(t => t.remove());
    getTags().forEach(kw => {
      wrap.insertBefore(makeTagEl(kw), input);
    });
  }

  function addTag(val) {
    val = val.trim().toLowerCase().replace(/,/g, '');
    if (!val) return;
    const tags = getTags();
    if (!tags.includes(val)) { tags.push(val); setTags(tags); render(); }
    input.value = '';
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(input.value); }
    if (e.key === 'Backspace' && !input.value) {
      const tags = getTags(); tags.pop(); setTags(tags); render();
    }
  });

  wrap.addEventListener('click', e => {
    if (e.target.classList.contains('tag-rm')) {
      const kw = e.target.dataset.kw;
      setTags(getTags().filter(t => t !== kw)); render();
    } else {
      input.focus();
    }
  });

  render();
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
